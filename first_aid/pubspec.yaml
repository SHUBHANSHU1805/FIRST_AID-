name: first_aid
description: A First Aid emergency assistant app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  lottie: ^3.1.2
  geolocator: ^13.0.2        # GPS location
  url_launcher: ^6.3.1       # open WhatsApp / SMS / calls
  permission_handler: ^11.3.1 # ask location permission

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/animations/